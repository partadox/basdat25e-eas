version: '3.8'

services:
  exam-system:
    build: .
    container_name: ce-exam-system-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DB_HOST=mysql
      - DB_NAME=ce_exam_system
      - DB_USER=exam_user
      - DB_PASS=${DB_PASSWORD:-exam_secure_password}
      - APP_ENV=production
      - APP_DEBUG=false
      - TZ=Asia/Jakarta
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - exam_logs:/var/log/apache2
      - ssl_certs:/etc/ssl/certs
    networks:
      - exam-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.5"

  mysql:
    image: mysql:8.0
    container_name: ce-exam-mysql-prod
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_secure_password}
      - MYSQL_DATABASE=ce_exam_system
      - MYSQL_USER=exam_user
      - MYSQL_PASSWORD=${DB_PASSWORD:-exam_secure_password}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"  # Only bind to localhost
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_config:/etc/mysql/conf.d
      - mysql_logs:/var/log/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./production/mysql-config.cnf:/etc/mysql/conf.d/custom.cnf
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "exam_user", "-p${DB_PASSWORD:-exam_secure_password}"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    command: >
      --default-authentication-plugin=mysql_native_password
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
      --innodb_buffer_pool_size=512M
      --max_connections=300
      --innodb_log_file_size=128M
      --innodb_flush_log_at_trx_commit=2
      --query_cache_size=64M
      --query_cache_type=1
      --slow_query_log=1
      --slow_query_log_file=/var/log/mysql/slow.log
      --long_query_time=2
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
        reservations:
          memory: 512M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    container_name: ce-exam-redis-prod
    restart: unless-stopped
    networks:
      - exam-network
    volumes:
      - redis_data:/data
      - ./production/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  nginx:
    image: nginx:alpine
    container_name: ce-exam-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./production/nginx.conf:/etc/nginx/nginx.conf
      - ./production/nginx-sites:/etc/nginx/conf.d
      - ssl_certs:/etc/ssl/certs
      - exam_logs:/var/log/nginx
    depends_on:
      - exam-system
    restart: unless-stopped
    networks:
      - exam-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ce-exam-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - exam-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: ce-exam-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - exam-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  mysql_config:
    driver: local
  mysql_logs:
    driver: local
  exam_logs:
    driver: local
  redis_data:
    driver: local
  ssl_certs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  exam-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/16
